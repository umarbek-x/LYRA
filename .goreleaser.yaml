version: 2

project_name: lyra

before:
  hooks:
    - go mod tidy

builds:
  - id: lyra
    main: ./cmd/lyra
    binary: lyra

    goos:
      - linux
      - windows
      - darwin

    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]

    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  use: github

release:
  draft: false
  prerelease: auto