name: CI

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - run: go mod tidy

      - run: go test ./...

      - run: go build ./...